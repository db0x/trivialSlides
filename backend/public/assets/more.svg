<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
 <defs>
  <style id="current-color-scheme" type="text/css">
   .ColorScheme-Text { color:#444444; }
  </style>
 </defs>
 <!-- The rest. Three dots in a row, which is what a menu of leftovers
      looks like everywhere; the file this replaced was a 3x3 grid of
      them, and a grid of nine dots is the sign for "all the apps". -->
 <circle style="fill:currentColor" class="ColorScheme-Text" cx="3.2" cy="8" r="1.4"/>
 <circle style="fill:currentColor" class="ColorScheme-Text" cx="8" cy="8" r="1.4"/>
 <circle style="fill:currentColor" class="ColorScheme-Text" cx="12.8" cy="8" r="1.4"/>
</svg>
