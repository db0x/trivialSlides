services:
  trivialslides:
    # A fixed name, so that `docker ps`, `docker logs` and a reverse proxy
    # all address the same container the same way. Without this line it is
    # named after whichever folder the compose file happens to sit in.
    container_name: trivialSlides
    build: ./backend
    restart: unless-stopped
    # Runs under your own account, not as root. Without this the container
    # writes as root, and a bind mount hands that straight through to the
    # host: the decks then belong to root and cannot be edited, backed up
    # or checked out again without sudo. The numbers are what `id -u` and
    # `id -g` report; 1000:1000 is the first account on most systems.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      # Sub-path behind a reverse proxy, e.g. /folien. Empty = the app sits
      # at the root. Same meaning as BASE_PATH in Relay -- once built in
      # there, Relay supplies this value.
      - BASE_PATH=${BASE_PATH:-}
      # Public address including BASE_PATH. Only needed so that link preview
      # cards point at a host that is actually reachable from outside.
      - PUBLIC_URL=${PUBLIC_URL:-}
      - NODE_ENV=production
      # The account above has no entry of its own in the image, so its home
      # would be a directory it cannot write to. Chromium wants a writable
      # one for the PDF export.
      - HOME=/tmp
      # A fixed path INSIDE the container. Where the decks live on the host
      # is what DECKS_HOST below says -- the two are named apart on purpose,
      # otherwise the same variable would mean two different places.
      - DECKS_DIR=/data/decks
      # The browser that prints the PDF. The image ships Chromium -- this
      # line exists only so a different one can be substituted.
      - BROWSER_PATH=${BROWSER_PATH:-/usr/bin/chromium}
      # The one feature that talks to a service outside this app: building a
      # deck from a prompt. Without a model to talk to it is not switched
      # off, it is absent -- no route, no button (backend/ai.js). All of
      # these are empty by default, so a compose file checked out by
      # somebody else brings no surprise and no error.
      #
      # WHICH model is deliberately not this project's business. Two
      # request shapes cover nearly the whole field:
      #   AI_API=anthropic  Claude (the default)
      #   AI_API=openai     OpenAI, Mistral, Groq, Together, OpenRouter,
      #                     vLLM -- and the local ones, Ollama and
      #                     LM Studio, which cost nothing
      - AI_API=${AI_API:-}
      # The key. ANTHROPIC_API_KEY is read as well, so a machine that
      # already exports it needs nothing new. A model on localhost wants
      # none, and that is allowed.
      - AI_KEY=${AI_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Where to send it. Empty means the dialect's own address. For a
      # model on the HOST machine this has to be host.docker.internal
      # rather than localhost, which inside the container is the container.
      - AI_URL=${AI_URL:-}
      # Which model writes. Sonnet where nothing is said and the dialect is
      # Claude's; for every other one the name has to be given.
      - AI_MODEL=${AI_MODEL:-}
      # How often the model may be handed its own mistakes before the
      # result is shown as it stands (backend/check.js is what finds them).
      - AI_ROUNDS=${AI_ROUNDS:-}
      # The fuse: how many of those calls an hour this process will make.
      - AI_PER_HOUR=${AI_PER_HOUR:-}
    volumes:
      # The decks themselves: one folder per deck holding deck.md and an
      # assets folder with the uploaded pictures. Deliberately a host path
      # and not a volume -- the content should be readable and backed up
      # with an editor of your choice.
      - ${DECKS_HOST:-./decks}:/data/decks
    ports: ["${BIND_ADDR:-127.0.0.1}:${PORT:-5002}:5000"]
